services:
  db:
    image: postgres:17
    container_name: ingrediscan-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ingrediscan-data:/var/lib/postgresql/data

volumes:
  ingrediscan-data: